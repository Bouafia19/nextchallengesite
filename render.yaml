services:
  # ============================================================================
  # OPTION 1 (RECOMMENDED): Unified Full-Stack Node Web Service
  # Serves both the Vue 3 production static site AND the /api/contact email backend.
  # Zero CORS issues, zero missing API routes, 100% turnkey for nextchallenge.tech.
  # ============================================================================
  - type: web
    name: nextchallenge-tech
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nextchallenge
      - key: ADMIN_API_KEY
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        value: nextchallenge2021@gmail.com
      - key: VITE_CONTACT_API_URL
        value: /api/contact
      - key: VITE_FLEETORA_URL
        value: https://fleetora-web.onrender.com
      - key: VITE_INVENTORY_URL
        value: https://inventory-v2-web-demo.onrender.com
      - key: VITE_TOURIVA_URL
        value: https://touriva-web.onrender.com
      - key: VITE_FACEBOOK_URL
        sync: false
      - key: VITE_INSTAGRAM_URL
        sync: false
      - key: VITE_LINKEDIN_URL
        sync: false
      # SMTP Configuration for Production Email Delivery
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "\"Next Challenge\" <nextchallenge2021@gmail.com>"
